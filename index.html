    <meta name="google" content="notranslate" />

    <meta name="google-site-verification" content="tdKsN1wAtPm-EBB8GKfgd800fB0wFS6WVhMAupWfDA4" />
    
    <!-- 🌟 Tab တွင်ပေါ်မည့် လိုဂို (Favicon) 🌟 -->
    <link rel="icon" type="image/svg+xml" href="https://i.ibb.co/37jM3yY/323382766-3392476561021481-1279930960017122176-n.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- 🌟 Google တွင် ပေါ်မည့် Title နှင့် Description (SEO) 🌟 -->
    <title>The Shangri-La Men's Retreat | Best Men Spa in Mandalay</title>
    <meta name="description" content="The Very First Healthy Men Spa in Mandalay since 2018. Experience ultimate relaxation, traditional massage, body scrub, and waxing tailored exclusively for men." />
    <meta name="keywords" content="men spa, mandalay spa, shangrila mens retreat, massage mandalay, body scrub, waxing for men" />

    <!-- 🌟 Facebook & Social Media တွင် Share လုပ်လျှင် ပေါ်မည့် ပုံနှင့် စာ (Open Graph) 🌟 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="The Shangri-La Men's Retreat" />
    <meta property="og:description" content="The Best Healthy Men Spa In Mandalay. Book your appointment online for an exclusive and relaxing experience." />
    <meta property="og:image" content="https://i.ibb.co/37jM3yY/323382766-3392476561021481-1279930960017122176-n.jpg" />

    <meta property="og:site_name" content="The Shangri-La Men's Retreat" />

    <!-- Twitter Card (Twitter/X တွင် Share လုပ်လျှင် ပေါ်ရန်) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Shangri-La Men's Retreat" />
    <meta name="twitter:description" content="The Best Healthy Men Spa In Mandalay since 2018." />

    <!-- 🌟 Web App အဖြစ် Install လုပ်ရန်အတွက် လိုအပ်သော PWA Meta Tags 🌟 -->
    <meta name="theme-color" content="#123524" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- 🌟 1. မြန်မာနိုင်ငံတွင် VPN မလိုဘဲ အမြဲပွင့်သည့် Cloudflare Tailwind Base CSS 🌟 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" crossorigin="anonymous" />

    <!-- 🌟 2. မူလ Tailwind Play CDN + VPN မဖွင့်ထားချိန်အတွက် JSDelivr / Unpkg Backup Mirror 🌟 -->
    <script src="https://cdn.tailwindcss.com" crossorigin="anonymous"></script>
    <script>
      // VPN မဖွင့်ထားသဖြင့် cdn.tailwindcss.com မပွင့်ပါက မြန်မာနိုင်ငံတွင် ပွင့်သော Mirror မှ အလိုအလျောက် ဆွဲယူမည်
      window.addEventListener('DOMContentLoaded', function() {
        if (typeof window.tailwind === 'undefined') {
          var backupScript = document.createElement('script');
          backupScript.src = 'https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4';
          backupScript.crossOrigin = 'anonymous';
          document.head.appendChild(backupScript);
        }
      });

      // 🌟 3. ယခင်က မှားယွင်းပြီး သိမ်းမိနေသော Offline Service Worker အဟောင်းများကို ရှင်းလင်းပေးခြင်း 🌟
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let registration of registrations) {
            registration.update();
          }
        });
      }
    </script>

    <!-- 🌟 4. Offline ဖြစ်နေချိန် သို့မဟုတ် CDN မပွင့်သေးချိန်တွင် ဒီဇိုင်း လုံးဝ ပုံမပျက်စေရန် Built-in Fallback CSS 🌟 -->
    <style>
      /* Brand Colors & Arbitrary Classes Backup */
      .bg-\[\#123524\] { background-color: #123524 !important; }
      .bg-\[\#1a4a32\] { background-color: #1a4a32 !important; }
      .bg-\[\#D4AF37\] { background-color: #D4AF37 !important; }
      .bg-\[\#0c0504\] { background-color: #0c0504 !important; }
      .bg-\[\#140705\] { background-color: #140705 !important; }
      .text-\[\#123524\] { color: #123524 !important; }
      .text-\[\#D4AF37\] { color: #D4AF37 !important; }
      .border-\[\#D4AF37\] { border-color: #D4AF37 !important; }
      .border-\[\#123524\] { border-color: #123524 !important; }
      
      /* Layout & Sizing Safeguards (လိုဂိုနှင့် ပုံများ အဆမတန် ကြီးမသွားစေရန်) */
      header img { max-width: 56px; max-height: 56px; object-fit: cover; }
      .w-8 { width: 2rem; } .h-8 { height: 2rem; }
      .w-10 { width: 2.5rem; } .h-10 { height: 2.5rem; }
      .w-12 { width: 3rem; } .h-12 { height: 3rem; }
      .w-14 { width: 3.5rem; } .h-14 { height: 3.5rem; }
      .w-16 { width: 4rem; } .h-16 { height: 4rem; }
      .w-20 { width: 5rem; } .h-20 { height: 5rem; }
      .aspect-square { aspect-ratio: 1 / 1; }
      .aspect-\[3\/4\] { aspect-ratio: 3 / 4; }
      .rounded-\[1rem\] { border-radius: 1rem; }
      .rounded-\[1\.2rem\] { border-radius: 1.2rem; }
      .rounded-\[1\.5rem\] { border-radius: 1.5rem; }
      .rounded-\[2rem\] { border-radius: 2rem; }
      .z-\[90\] { z-index: 90; }
      .z-\[100\] { z-index: 100; }
      .z-\[200\] { z-index: 200; }
      .z-\[999\] { z-index: 999; }
      .z-\[9999\] { z-index: 9999; }
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    
    <!-- 🌟 မူလရှိပြီးသား PWA Manifest 🌟 -->
    <link rel="manifest" href="/manifest.json" />
