<!DOCTYPE html>
<!-- 🌟 FIX: Google Translate အလိုအလျောက် ဝင်ပြီး App Crash ဖြစ်ခြင်းကို တားဆီးရန် translate="no" ထည့်ထားပါသည် 🌟 -->
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />

    <!-- 🌟 FIX: Google အား ဘာသာမပြန်စေရန် ထပ်မံတားဆီးခြင်း 🌟 -->
    <meta name="google" content="notranslate" />

    <!-- Google Site Verification -->
    <meta name="google-site-verification" content="tdKsN1wAtPm-EBB8GKfgd800fB0wFS6WVhMAupWfDA4" />

    <!-- 🌟 Tab တွင်ပေါ်မည့် လိုဂို (Favicon) - Admin Panel မှ အလိုအလျောက် ပြောင်းလဲနိုင်ရန် id ထည့်ထားသည် 🌟 -->
    <link id="app-favicon" rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 🌟 Google တွင် ပေါ်မည့် Title နှင့် Description (SEO) 🌟 -->
    <title>The Shangri-La Men's Retreat | Best Men Spa in Mandalay</title>
    <meta name="description" content="The Very First Healthy Men Spa in Mandalay since 2018. Experience ultimate relaxation, traditional massage, body scrub, and waxing tailored exclusively for men." />
    <meta name="keywords" content="men spa, mandalay spa, shangrila mens retreat, massage mandalay, body scrub, waxing for men" />
    <meta name="author" content="The Shangri-La Men's Retreat" />

    <!-- 🌟 Facebook, Telegram, Viber & Safari Link Preview တွင် ပေါ်မည့် ပုံနှင့် စာ (Open Graph) 🌟 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="The Shangri-La Men's Retreat" />
    <meta property="og:description" content="The Best Healthy Men Spa In Mandalay. Book your appointment online for an exclusive and relaxing experience." />
    <meta property="og:image" content="https://www.shangrilamenretreat.online/logo.png" />
    <meta property="og:image:secure_url" content="https://www.shangrilamenretreat.online/logo.png" />
    <meta property="og:url" content="https://www.shangrilamenretreat.online" />
    <meta property="og:site_name" content="The Shangri-La Men's Retreat" />

    <!-- Twitter Card (Twitter/X တွင် Share လုပ်လျှင် ပေါ်ရန်) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Shangri-La Men's Retreat" />
    <meta name="twitter:description" content="The Best Healthy Men Spa In Mandalay since 2018." />
    <meta name="twitter:image" content="https://www.shangrilamenretreat.online/logo.png" />

    <!-- 🌟 Web App အဖြစ် Install လုပ်ရန်အတွက် လိုအပ်သော PWA Meta Tags 🌟 -->
    <meta name="theme-color" content="#123524" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Shangri-La Spa" />
    <link id="app-apple-icon" rel="apple-touch-icon" href="/logo.png" />

    <!-- 🌟 Non-Blocking Conditional Telegram Mini App SDK (VPN မလိုဘဲ မြန်မာနိုင်ငံတွင် ချက်ချင်းပွင့်စေရန် Telegram Context ရှိမှသာ Async ခေါ်မည်) 🌟 -->
    <script>
      (function () {
        function initTelegramWebApp() {
          try {
            if (window.Telegram && window.Telegram.WebApp) {
              var tg = window.Telegram.WebApp;
              tg.ready();
              tg.expand();
              if (typeof tg.setHeaderColor === 'function') tg.setHeaderColor('#0B2419');
              if (typeof tg.setBackgroundColor === 'function') tg.setBackgroundColor('#0B2419');

              var tgUser = tg.initDataUnsafe && tg.initDataUnsafe.user;
              if (tgUser && tgUser.id) {
                var capturedUser = {
                  chatId: String(tgUser.id),
                  firstName: tgUser.first_name || '',
                  lastName: tgUser.last_name || '',
                  username: tgUser.username || '',
                  languageCode: tgUser.language_code || 'my',
                  capturedAt: new Date().toISOString()
                };
                localStorage.setItem('shangrila_tg_user', JSON.stringify(capturedUser));
                localStorage.setItem('shangrila_customer_chat_id', String(tgUser.id));
              }

              var startParam = tg.initDataUnsafe && tg.initDataUnsafe.start_param;
              if (startParam) {
                sessionStorage.setItem('shangrila_tg_start_param', String(startParam));
              }
            }
          } catch (e) {
            console.warn('Telegram WebApp init warning:', e);
          }
        }

        try {
          var hash = window.location.hash || '';
          var search = window.location.search || '';
          var isTelegramContext =
            Boolean(window.TelegramWebviewProxy) ||
            hash.indexOf('tgWebAppData') !== -1 ||
            hash.indexOf('tgWebAppVersion') !== -1 ||
            search.indexOf('tgWebAppData') !== -1 ||
            search.indexOf('tgWebAppStartParam') !== -1 ||
            /Telegram/i.test(navigator.userAgent || '');

          if (isTelegramContext) {
            var s = document.createElement('script');
            s.src = 'https://telegram.org/js/telegram-web-app.js';
            s.async = true;
            s.onload = initTelegramWebApp;
            s.onerror = function () { /* Ignore when Telegram is unreachable */ };
            document.head.appendChild(s);
          }
        } catch (e) {
          console.warn('Telegram loader warning:', e);
        }
      })();
    </script>

    <!-- 🌟 Dynamic PWA Manifest (Admin မှ Branding တွင်ပြောင်းသော Logo ကို PWA Icon အဖြစ် အလိုအလျောက် သုံးရန်) 🌟 -->
    <link id="app-manifest" rel="manifest" href="/manifest.json" />
    <script>
      (function () {
        try {
          var brandingData = localStorage.getItem('shangrila_branding');
          var logoUrl = window.location.origin + '/logo.png';

          if (brandingData) {
            try {
              var parsed = JSON.parse(brandingData);
              var candidateLogo = parsed.logoUrl || parsed.headerLogo || parsed.logo;
              // imgbb link ပျက်များကို ပြန်မသုံးမိစေရန် စစ်ဆေးခြင်း
              if (candidateLogo && candidateLogo.indexOf('ibb.co') === -1 && candidateLogo.indexOf('imgbb.com') === -1) {
                logoUrl = candidateLogo;
              }
            } catch (err) {
              console.warn('Branding parse warning:', err);
            }
          }

          var params = new URLSearchParams(window.location.search);
          var path = window.location.pathname.toLowerCase();
          var isStaff = params.get('portal') === 'staff' || params.get('mode') === 'staff' || path.indexOf('staff') !== -1;

          if (isStaff) {
            document.title = 'Shangri-La Staff Portal';
          }

          var manifestObj = {
            "id": isStaff ? "/?mode=staff" : "/",
            "name": isStaff ? "Shangri-La Staff Portal" : "The Shangri-La Men's Retreat",
            "short_name": isStaff ? "SL Staff" : "Shangri-La",
            "description": "The Shangri-La Men's Retreat - Beyond Relaxation",
            "start_url": isStaff ? "/?mode=staff" : "/",
            "scope": "/",
            "display": "standalone",
            "orientation": "portrait",
            "background_color": "#0B2419",
            "theme_color": "#0B2419",
            "icons": [
              {
                "src": logoUrl,
                "sizes": "192x192",
                "type": "image/png",
                "purpose": "any"
              },
              {
                "src": logoUrl,
                "sizes": "512x512",
                "type": "image/png",
                "purpose": "any"
              }
            ]
          };

          var stringManifest = JSON.stringify(manifestObj);
          var blob = new Blob([stringManifest], { type: 'application/json' });
          var manifestLink = document.getElementById('app-manifest');
          if (manifestLink) {
            manifestLink.setAttribute('href', URL.createObjectURL(blob));
          }
        } catch (e) {
          console.warn('Dynamic manifest generation error:', e);
        }
      })();
    </script>
  </head>

  <body class="bg-gray-50 text-gray-900 antialiased selection:bg-[#D4AF37] selection:text-[#123524]">
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <div id="root">
      <!-- 🌟 Instant Zero-White-Screen Splash (JS/CSS Load နေစဉ် အဖြူ Screen မပြဘဲ ချက်ချင်း Shangri-La Loading Screen ပြပေးမည်) 🌟 -->
      <div
        id="initial-boot-splash"
        style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a1f15 0%,#123524 50%,#0a1f15 100%);overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;"
      >
        <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:28rem;height:28rem;background:#D4AF37;border-radius:9999px;filter:blur(120px);opacity:0.12;pointer-events:none;"></div>
        <div style="position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;padding:0 2rem;">
          <img
            src="/logo.png"
            alt="The Shangri-La Logo"
            style="width:10.5rem;height:10.5rem;object-fit:contain;margin-bottom:2.25rem;filter:drop-shadow(0 0 15px rgba(212,175,55,0.3));"
          />
          <div style="color:#D4AF37;font-size:11px;font-weight:700;letter-spacing:0.35em;text-transform:uppercase;margin-bottom:1.5rem;opacity:0.85;">
            Preparing Your Retreat
          </div>
          <div style="width:14rem;height:3px;background:#1a4a32;border-radius:9999px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,0.4);">
            <div style="width:28%;height:100%;background:linear-gradient(90deg,#b38b22,#D4AF37);border-radius:9999px;box-shadow:0 0 10px rgba(212,175,55,0.8);"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 🌟 App ရဲ့ Main Code သို့ ညွှန်းခြင်း (Service Worker ကို src/main.tsx တွင် တစ်ကြိမ်တည်း Register လုပ်ထားသည်) 🌟 -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
